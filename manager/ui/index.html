<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NanoClaw Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="logo-icon">N</span>
          NanoClaw
          <span class="logo-version">v0.1</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-route="settings">
          <span class="nav-icon">⚙️</span>
          设置
        </button>
        <button class="nav-item" data-route="mcp">
          <span class="nav-icon">🔌</span>
          MCP 服务
        </button>
        <button class="nav-item" data-route="gateway">
          <span class="nav-icon">🖥️</span>
          网关
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="theme-toggle" title="切换主题" style="justify-content:center;font-size:12px;padding:6px">
          🌙
        </button>
        Made with ❤️ · Manager v1.0
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="main-content">
      <!-- 由 JS 动态渲染 -->
    </main>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 脚本 -->
  <script src="js/api.js?v=3"></script>
  <script src="js/settings.js?v=2"></script>
  <script src="js/mcp.js?v=2"></script>
  <script src="js/gateway.js?v=6"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
